<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Шесть концепций сайта</title>
<link rel="stylesheet" href="../assets/fonts/inter.css">
<style>
*{box-sizing:border-box;margin:0}
html{background:#000}
body{font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;color:#F5F5F7;min-height:100vh;padding:clamp(28px,6vw,80px) clamp(18px,4vw,48px);-webkit-font-smoothing:antialiased;background:radial-gradient(60vmax 60vmax at 0 0,rgba(43,91,255,.18),transparent 70%),radial-gradient(60vmax 60vmax at 100% 100%,rgba(107,75,255,.16),transparent 70%)}
main{max-width:1240px;margin:0 auto}
h1{font-size:clamp(34px,5.4vw,68px);font-weight:600;letter-spacing:-.03em;line-height:1.04}
.lead{color:#A1A1A6;font-size:clamp(17px,1.5vw,20px);line-height:1.45;max-width:46em;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:clamp(28px,4vw,52px)}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
a.c{display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:26px;overflow:hidden;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}
a.c:hover{transform:translateY(-6px);border-color:rgba(156,196,255,.5)}
a.c:focus-visible{outline:3px solid #9CC4FF;outline-offset:3px}
.pic{aspect-ratio:16/10;background:linear-gradient(140deg,#10142c,#06070f);overflow:hidden;display:grid;place-items:center;font-size:64px;font-weight:600;letter-spacing:-.04em;color:rgba(255,255,255,.14)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top}
.t{padding:20px 22px 24px;display:grid;gap:8px}
.n{font-size:13.5px;color:#9CC4FF}
h2{font-size:24px;font-weight:600;letter-spacing:-.02em}
.t p{color:#A1A1A6;font-size:15.5px;line-height:1.42}
.go{margin-top:6px;color:#7DB8FF;font-size:15.5px}
.go::after{content:" ›"}
.foot{margin-top:40px;color:#6E6E73;font-size:14px;max-width:70ch}
.foot a{color:#7DB8FF}
</style>
</head>
<body>
<main>
  <h1>Шесть концепций сайта</h1>
  <p class="lead">Это не готовые сайты, а шесть разных идей с первым экраном и главной механикой — чтобы выбрать направление. Откройте каждую, полистайте, покликайте. Выбранную доведём до полного сайта.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Прежние версии: <a href="../v4/">версия 4</a>, <a href="../v5/">версия 5</a>, <a href="../flagship/">флагман «МГЛА»</a>.</p>
</main>
<script>
const C = [
  ['chat', 'Переписка', 'Весь сайт — это разговор в мессенджере. Мы пишем первыми, вы отвечаете кнопками, а работы и цены приходят как сообщения.'],
  ['desktop', 'Рабочий стол', 'Сайт как мягкая операционная система: окна, док, обои. Разделы открываются приложениями, их можно двигать.'],
  ['gallery', 'Галерея', 'Ночной музей в 3D. Сайты висят как картины, прокрутка ведёт камеру по залам.'],
  ['builder', 'Соберите свой', 'Конфигуратор, как при покупке техники Apple: выбираете — и сайт собирается на глазах, цена считается рядом.'],
  ['film', 'Кино', 'Огромные слова на весь экран, внутри букв идут ваши сайты. Прокрутка работает как монтаж.'],
  ['bento', 'Пульт', 'Всё на одном экране: живые плитки, как виджеты. Каждую можно потрогать и раскрыть.'],
];
document.getElementById('grid').innerHTML = C.map(([id, name, text], i) => `<a class="c" href="${id}/index.html">
  <div class="pic"><img src="shots/${id}.jpg" alt="Первый экран концепции «${name}»" onerror="this.replaceWith(document.createTextNode('${i + 1}'))"></div>
  <div class="t"><span class="n">Концепция ${i + 1}</span><h2>${name}</h2><p>${text}</p><span class="go">Открыть</span></div></a>`).join('');
</script>
</body>
</html>
